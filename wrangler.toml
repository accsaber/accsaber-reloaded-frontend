"$schema" = "./node_modules/wrangler/config-schema.json"
name = "accsaber-reloaded-frontend"
compatibility_date = "2026-07-27"
main = "./worker/index.ts"

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/v1/*",
  "/proxy/*",
  "/players/*",
  "/maps/*",
  "/campaigns/*",
  "/robots.txt",
]

[observability.logs]
enabled = true
invocation_logs = true

[env.staging]
name = "accsaber-staging-reloaded-frontend"

[env.staging.vars]
API_PROXY_TARGET = "https://staging-api.accsaber.com"

[env.staging.assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/v1/*",
  "/proxy/*",
  "/players/*",
  "/maps/*",
  "/campaigns/*",
  "/robots.txt",
]
