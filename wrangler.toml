"$schema" = "./node_modules/wrangler/config-schema.json"
name = "accsaber-reloaded-frontend"
compatibility_date = "2026-07-27"
main = "./worker/index.ts"

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/v1/*",
  "/proxy/*",
  "/players/*",
  "/maps/*",
  "/campaigns/*",
  "/robots.txt",
]

[observability.logs]
enabled = true
invocation_logs = true

# Staging runs as its own Worker so it gets its own build. VITE_WS_BASE is baked
# into the bundle at build time, so pointing staging at the staging API needs a
# separate build, not just a separate hostname.
[env.staging]
name = "accsaber-reloaded-frontend-staging"

[env.staging.vars]
API_PROXY_TARGET = "https://staging-api.accsaber.com"

[env.staging.assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/v1/*",
  "/proxy/*",
  "/players/*",
  "/maps/*",
  "/campaigns/*",
  "/robots.txt",
]
