name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/checks.yml
    with:
      suite: lint

  build:
    uses: ./.github/workflows/checks.yml
    with:
      suite: build

  types:
    uses: ./.github/workflows/checks.yml
    with:
      suite: types
